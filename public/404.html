<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #343a40;
            font-family: 'Poppins', sans-serif; /* Attractive Font */
        }
        .error-container {
            max-width: 700px;
            padding: 50px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .error-code {
            font-size: 12rem;
            font-weight: 900;
            color: #ff5757; /* A striking red tone */
            line-height: 1;
            margin-bottom: 0;
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.05);
            animation: bounceIn 1s ease-out;
        }
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-top: -10px;
            margin-bottom: 20px;
            color: #343a40;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            transition: transform 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.3);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">OOPS! Page Not Found</h2>
        <p class="lead mb-4">We're sorry, but the page you were looking for doesn't exist.</p>
        <p class="mb-5">It might have been moved or deleted. Let's get you back to safety.</p>
        <a href="https://rezaforoghi/" class="btn btn-primary btn-lg">Go to Homepage</a>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            // Optional: A smooth slide-in effect using jQuery
            $('.error-container').css('opacity', 0).delay(300).animate({ opacity: 1 }, 800);
        });
    </script>
</body>
</html>
